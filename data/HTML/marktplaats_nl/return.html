<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>Terug</title>
</head>
<body style="margin:0;padding:0;background:#e8edf2;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;">&nbsp;</div>
  <center style="width:100%;background:#e8edf2;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;margin:24px auto;">
      <tr>
        <td style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,0.08);">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="background:#334155;padding:20px 24px;text-align:center;">
                <p style="margin:0;font-size:17px;font-weight:700;color:#ffffff;">Terugactie</p>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 24px;text-align:center;">
                <p style="margin:0 0 10px;font-size:15px;color:#475569;">Beste verkoper,</p>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#334155;">
                  Er is een update voor <strong>{{ITEM_TITLE}}</strong> ({{PRICE}}).
                </p>
                <a href="{{LINK}}" target="_blank" rel="noopener"
                   style="display:inline-block;background:#1e293b;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;padding:14px 28px;border-radius:8px;">
                  Terug naar overzicht
                </a>
                <p style="margin:16px 0 0;font-size:12px;color:#94a3b8;">{{DATE}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
