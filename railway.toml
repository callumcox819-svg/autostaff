# Один startCommand для всех сервисов репо; роль: Variables → APP_ROLE
# newbot: APP_ROLE=bot (или не задавать)
# imap-worker: APP_ROLE=imap_worker
# См. docs/railway-imap-worker.md

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "sh scripts/railway-start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
