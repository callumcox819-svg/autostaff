<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Neue Zahlung — tutti.ch</title>
    <style>
        body { margin: 0; padding: 0; background: #eceef1; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        table { border-collapse: collapse; }
        .accent { color: #e30613; }
    </style>
</head>
<body style="margin:0;padding:0;background:#eceef1;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<center style="width:100%;background:#eceef1;">
    <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:20px auto;" bgcolor="#eceef1">
        <tr>
            <td style="padding:0 10px;">
                <table width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:14px;border-left:5px solid #e30613;" bgcolor="#ffffff">
                    <tr>
                        <td style="padding:20px 24px 8px;">
                            <p style="margin:0;font-size:20px;font-weight:800;color:#e30613;">tutti.ch</p>
                            <p style="margin:8px 0 0;font-size:12px;color:#9aa0a6;letter-spacing:0.4px;">NEUE ZAHLUNG</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:12px 24px 8px;text-align:center;" align="center">
                            <h2 style="margin:0 0 12px;font-size:20px;color:#222;font-weight:700;">Zahlung für Ihr Inserat eingegangen</h2>
                            <p style="margin:0;font-size:15px;line-height:1.55;color:#5f6b75;max-width:420px;">
                                <strong class="accent" style="color:#e30613;">{{ITEM_TITLE}}</strong><br>
                                Betrag: <strong class="accent" style="color:#e30613;">{{PRICE}}</strong>
                            </p>
                            <p style="margin:14px 0 0;font-size:14px;color:#6b7280;">
                                Der Käufer hat bezahlt. Öffnen Sie die Versandseite, um den Verkauf abzuschliessen.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 24px 26px;text-align:center;" align="center">
                            <a href="{{LINK}}" target="_blank" rel="noopener" style="background:#e30613;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:13px 34px;border-radius:999px;display:inline-block;">Versanddetails ansehen</a>
                            <p style="margin:14px 0 0;font-size:12px;color:#aaa;">{{DATE}}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:12px 24px 16px;font-size:11px;color:#b0b5bb;text-align:center;border-top:1px solid #f2f2f2;">
                            tutti.ch — bitte nicht auf diese Nachricht antworten.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</center>
</body>
</html>
