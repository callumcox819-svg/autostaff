<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahlung erhalten — tutti.ch</title>
    <style>
        body{margin:0;padding:0;background:#f2f4f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
        table{border-collapse:collapse}
    </style>
</head>
<body style="margin:0;padding:0;background:#f2f4f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<center style="width:100%;background:#f2f4f5;">
<table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#fff;border-radius:16px;margin:24px auto;">
<tr>
<td style="background:linear-gradient(135deg,#e30613,#ff3d4a);border-radius:16px 16px 0 0;text-align:center;padding:28px 24px;">
<p style="margin:0 0 6px;font-size:14px;font-weight:700;color:#ffe8ea;letter-spacing:0.3px;">tutti.ch</p>
<h1 style="font-size:26px;font-weight:700;margin:0;color:#fff;">Zahlung erhalten</h1>
<p style="font-size:15px;margin:8px 0 0;color:#fff0f1;">Sicher bezahlt • Versand ausstehend</p>
</td>
</tr>
<tr>
<td style="padding:28px;">
<table width="100%"><tr>
<td style="color:#5f6b75;font-weight:600;">Totalbetrag</td>
<td align="right" style="font-size:22px;font-weight:800;color:#e30613;">{{PRICE}}</td>
</tr></table>
<p style="margin:20px 0 8px;color:#5f6b75;">Bezahlt am: <strong>{{DATE}}</strong></p>
<p style="margin:0 0 16px;color:#1a1a1a;"><strong>{{ITEM_TITLE}}</strong></p>
<p style="margin:0;color:#5f6b75;">Käufer: <strong>{{BUYER_NAME}}</strong><br>Adresse: <strong>{{ADDRESS}}</strong></p>
<p style="margin:24px 0 0;text-align:center;">
<a href="{{LINK}}" target="_blank" rel="noopener" style="display:inline-block;background:#e30613;color:#fff;text-decoration:none;font-weight:600;padding:12px 28px;border-radius:40px;">Versand registrieren</a>
</p>
</td>
</tr>
<tr>
<td style="padding:16px 24px;font-size:11px;color:#9aa5b1;text-align:center;border-top:1px solid #eef1f4;">
Automatische Mitteilung von tutti.ch. Antworten auf diese Adresse werden nicht gelesen.
</td>
</tr>
</table>
</center>
</body>
</html>
