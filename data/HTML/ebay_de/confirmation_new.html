<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>Bevestiging (nieuw)</title>
</head>
<body style="margin:0;padding:0;background:#eef2f7;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;">&nbsp;</div>
  <center style="width:100%;background:#eef2f7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;margin:24px auto;">
      <tr>
        <td style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,0.08);">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="background:#0f172a;padding:20px 24px;text-align:center;border-bottom:3px solid #64748b;">
                <p style="margin:0;font-size:17px;font-weight:700;color:#ffffff;">Nieuwe bevestiging</p>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 24px 10px;text-align:left;">
                <p style="margin:0 0 12px;font-size:15px;color:#475569;">Hallo,</p>
                <p style="margin:0 0 10px;font-size:15px;line-height:1.55;color:#334155;">
                  Er is een betaling voor <strong>{{ITEM_TITLE}}</strong>.
                </p>
                <p style="margin:0 0 18px;font-size:15px;line-height:1.55;color:#334155;">
                  Bedrag: <strong>{{PRICE}}</strong> · Datum: {{DATE}}
                </p>
                <p style="margin:0 0 8px;font-size:14px;color:#64748b;">Koper: {{BUYER_NAME}}</p>
                <p style="margin:0 0 22px;font-size:14px;color:#64748b;">Adres: {{ADDRESS}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 28px;" align="center">
                <a href="{{LINK}}" target="_blank" rel="noopener"
                   style="display:inline-block;background:#475569;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;padding:14px 28px;border-radius:8px;">
                  Openen
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
