<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserat verkauft — tutti.ch</title>
    <style>
        body{margin:0;padding:0;background:#f2f4f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
        .brand{color:#e30613;font-size:22px;font-weight:bold}
        .cta{background:#e30613;color:#fff;padding:14px 32px;text-decoration:none;border-radius:40px;font-weight:600;display:inline-block}
        .accent{color:#e30613}
    </style>
</head>
<body style="margin:0;padding:0;background:#f2f4f5;">
<center>
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;margin:20px auto;">
<tr><td style="padding:24px 20px;border-bottom:1px solid #eee;">
<span class="brand">tutti.ch</span>
</td></tr>
<tr><td style="padding:32px 20px;text-align:center;">
<h2 style="color:#1a1a1a;margin:0 0 12px;font-size:22px;">Ihr Inserat wurde verkauft</h2>
<p style="color:#5f6b75;line-height:1.5;margin:0 0 20px;">
Das Inserat <strong class="accent">{{ITEM_TITLE}}</strong> wurde gekauft. Bitte schliessen Sie den Versand ab.
</p>
<table width="100%" style="background:#f8f8f8;border-radius:12px;"><tr><td style="padding:20px;">
<p style="margin:0 0 8px;color:#5f5f5f;">Betrag: <strong class="accent">{{PRICE}}</strong></p>
<p style="margin:0;color:#5f5f5f;">E-Mail Käufer: <strong class="accent">{{SELLER_EMAIL}}</strong></p>
</td><td align="right" style="padding:20px;width:140px;">
<img src="{{IMAGE_URL}}" alt="Produkt" width="128" style="border-radius:8px;border:1px solid #e0e0e0;">
</td></tr></table>
<p style="margin:28px 0 0;">
<a href="{{LINK}}" target="_blank" rel="noopener" class="cta">Versanddetails</a>
</p>
</td></tr>
</table>
</center>
</body>
</html>
