<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>Bevestiging</title>
</head>
<body style="margin:0;padding:0;background:#e8edf2;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;">&nbsp;</div>
  <center style="width:100%;background:#e8edf2;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;margin:24px auto;">
      <tr>
        <td style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,0.08);">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td style="background:#1e293b;padding:22px 24px;text-align:center;">
                <p style="margin:0;font-size:18px;font-weight:700;color:#ffffff;letter-spacing:0.02em;">Bevestiging</p>
                <p style="margin:6px 0 0;font-size:13px;color:#94a3b8;">Veilige afhandeling</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px;text-align:center;">
                <p style="margin:0 0 8px;display:inline-block;background:#e2e8f0;color:#334155;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;">Status OK</p>
                <h1 style="margin:14px 0 10px;font-size:22px;line-height:1.3;color:#0f172a;">Betaling ontvangen</h1>
                <p style="margin:0 0 8px;font-size:15px;color:#475569;">Beste verkoper,</p>
                <p style="margin:0 0 6px;font-size:15px;line-height:1.55;color:#334155;">
                  De koper heeft <strong>{{ITEM_TITLE}}</strong> betaald.
                </p>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#334155;">
                  Bevestig hieronder om verder te gaan.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 20px;" align="center">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:280px;background:#f1f5f9;border-radius:10px;">
                  <tr>
                    <td style="padding:14px 16px;text-align:center;">
                      <p style="margin:0 0 4px;font-size:12px;color:#64748b;">Bedrag</p>
                      <p style="margin:0;font-size:26px;font-weight:800;color:#0f172a;">{{PRICE}}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:4px 24px 28px;" align="center">
                <a href="{{LINK}}" target="_blank" rel="noopener"
                   style="display:inline-block;background:#334155;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;padding:14px 28px;border-radius:8px;">
                  Doorgaan
                </a>
                <p style="margin:14px 0 0;font-size:12px;color:#94a3b8;">{{DATE}}</p>
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e2e8f0;padding:16px 24px 22px;text-align:center;">
                <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">
                  Koper: {{BUYER_NAME}} · {{ADDRESS}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
