<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>Melding</title>
</head>
<body style="margin:0;padding:0;background:#e8edf2;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;">&nbsp;</div>
  <center style="width:100%;background:#e8edf2;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;margin:24px auto;">
      <tr>
        <td style="background:#ffffff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(15,23,42,0.08);text-align:center;">
          <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;">Melding</p>
          <h1 style="margin:0 0 12px;font-size:20px;color:#0f172a;">Nieuwe update</h1>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#334155;">
            <strong>{{ITEM_TITLE}}</strong><br/>
            {{PRICE}}
          </p>
          <a href="{{LINK}}" target="_blank" rel="noopener"
             style="display:inline-block;background:#334155;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 24px;border-radius:8px;">
            Bekijken
          </a>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
